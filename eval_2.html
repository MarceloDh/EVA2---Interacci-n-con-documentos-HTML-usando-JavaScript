<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <div class="container mt-5 mb-5">
        <div class="form-wrapper">
            <h1 class="mb-4 text-start form-title">Formulario de Registro</h1>

            <form id="registroForm" novalidate>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre completo">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="rut" class="form-label">Rut</label>
                        <input type="text" class="form-control" id="rut" placeholder="Ej: 12345678-9">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="fecha" class="form-label">Fecha de Nacimiento</label>
                        <input type="text" class="form-control" id="fecha" placeholder="dd/MM/yyyy">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="cv" class="form-label">Curriculum Vitae</label>
                        <input class="form-control" type="file" id="cv" accept=".pdf, .docx">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Correo electrónico">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="genero" class="form-label">Género</label>
                        <select class="form-select" id="genero">
                            <option value="" selected>Seleccione...</option>
                            <option value="masculino">Masculino</option>
                            <option value="femenino">Femenino</option>
                        </select>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-md-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" placeholder="********">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="re_password" class="form-label">Repetir Contraseña</label>
                        <input type="password" class="form-control" id="re_password" placeholder="********">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-md-4">
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 d-flex justify-content-end">
                        <button type="button" class="btn btn-mockup me-3"
                            onclick="limpiarFormulario()">Cancelar</button>
                        <button type="button" class="btn btn-mockup" onclick="validarFormulario(event)">Guardar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="eval_2.js"></script>
</body>

</html>
